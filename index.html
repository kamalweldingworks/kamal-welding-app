                    
    <!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sri Lanka Kamal Welding Works</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</head>

<body>

<div class="container">

    <!-- Header -->

    <header class="header">

        <h1>Sri Lanka Kamal Welding Works</h1>

        <p>Professional Welding Quotation System</p>

    </header>

    <!-- Customer Details -->

    <section class="card">

        <h2>Customer Details</h2>

        <div class="grid-2">

            <div>

                <label>Quotation No</label>

                <input type="text" id="quotationNo" readonly>

            </div>

            <div>

                <label>Date</label>

                <input type="date" id="quotationDate">

            </div>

            <div>

                <label>Customer Name</label>

                <input type="text" id="customerName">

            </div>

            <div>

                <label>Phone Number</label>

                <input type="text" id="customerPhone">

            </div>

            <div class="full-width">

                <label>Customer Address</label>

                <textarea id="customerAddress"></textarea>

            </div>

        </div>

    </section>
