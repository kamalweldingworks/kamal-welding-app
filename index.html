<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sri Lanka Kamal Welding Works</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>🔨 Sri Lanka Kamal Welding Works</h1>

<h2>Customer Details</h2>

<label>Customer Name</label>
<input type="text" placeholder="Enter Customer Name">

<label>Phone Number</label>
<input type="text" placeholder="Enter Phone Number">
<label>Date</label>
<input type="date" id="quotationDate">
<label>Address</label>
<textarea placeholder="Enter Address"></textarea>

<label>Job Type</label>
<select>
<option>Gate</option>
<option>Roof</option>
<option>Handrail</option>
<option>Grill</option>
<option>Stair</option>
<option>Canopy</option>
<option>Other</option>
</select>

<h2>Measurements</h2>

<label>Length (ft)</label>
<input type="number"id="length">

<label>Width (ft)</label>
<input type="number" id="width">

<label>Height (ft)</label>
<input type="number"id="height">

<button>Save Job</button>
<h2>Quotation</h2>

<label>Material Cost (Rs.)</label>
<input type="number" id="materialCost">

<label>Labour Charge (Rs.)</label>
<input type="number" id="labourCharge">

<label>Total Amount (Rs.)</label>
<input type="number" id="totalAmount" readonly>

<button onclick="calculateTotal()">Calculate Total</button>
<button onclick="downloadPDF()">Download PDF</button>


<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="script.js"></script>

</body>
</html>
