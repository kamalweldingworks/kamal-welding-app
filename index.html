
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sri Lanka Kamal Welding Works</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>

<div class="container">

    <!-- Company Header -->

    <header class="header">

        <div class="logo">

            <img src="logo.png" id="companyLogo" alt="Logo">

        </div>

        <div class="company">

            <h1>Sri Lanka Kamal Welding Works</h1>

            <p>Professional Steel Fabrication & Welding Services</p>

            <p>We Undertake All Types of Iron Works Across Sri Lanka</p>

        </div>

    </header>

    <hr>

    <!-- Title -->

    <h2 class="title">
        Welding Quotation System
    </h2>

    <!-- Customer Details -->

    <section class="card">

        <h3>Customer Details</h3>

        <div class="grid">

            <div>

                <label>Quotation No</label>

                <input
                type="text"
                id="quotationNo"
                readonly>

            </div>

            <div>

                <label>Date</label>

                <input
                type="date"
                id="quotationDate">

            </div>

            <div>

                <label>Customer Name</label>

                <input
                type="text"
                id="customerName"
                placeholder="Enter Customer Name">

            </div>

            <div>

                <label>Phone Number</label>

                <input
                type="tel"
                id="customerPhone"
                placeholder="07XXXXXXXX">

            </div>

            <div>

                <label>Customer Address</label>

                <textarea
                id="customerAddress"
                rows="3"></textarea>

            </div>

            <div>

                <label>Job Location</label>

                <textarea
                id="jobLocation"
                rows="3"></textarea>

            </div>

        </div>

    </section>
